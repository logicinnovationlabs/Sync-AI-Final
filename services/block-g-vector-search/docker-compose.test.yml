version: "3.8"

# Test dependencies for Phase 2 signoff (reuse host Qdrant on 6333 if already up).
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   set VECTOR_DB_TYPE=qdrant
#   pytest tests/ -v --tb=short

services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: block-g-test-qdrant
    ports:
      - "6335:6333"
    volumes:
      - block_g_test_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: block-g-test-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  block_g_test_qdrant_data:
