version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: block-g-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - block_g_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: block-g-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vector-search:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: block-g-vector-search
    ports:
      - "8087:8087"
    environment:
      VECTOR_DB_TYPE: qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      REDIS_URL: redis://redis:6379/3
      ENVIRONMENT: development
      EMBEDDING_DIMENSIONS: "64"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./fixtures:/app/fixtures

volumes:
  block_g_qdrant_data:
