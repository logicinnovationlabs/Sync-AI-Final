services:
  postgres:
    image: postgres:15-alpine
    container_name: block-k-postgres-test
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: block_d
    ports:
      - "15434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -u user -d block_d || pg_isready -U user -d block_d"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: block-k-minio-test
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  acl_mock:
    image: python:3.11-slim
    container_name: block-k-acl-mock
    working_dir: /srv
    volumes:
      - ./mocks:/srv
    command: python acl_mock_server.py
    ports:
      - "18001:8001"
