replicaCount: 1
image:
  repository: block-i-signals
  tag: "0.1.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8089
env:
  ENVIRONMENT: production
  SIGNALS_BACKEND: postgres
  PRIVACY_THRESHOLD: "5"
  RETENTION_DAYS: "90"
  ENFORCE_TENANT_ISOLATION: "true"
  KAFKA_ENABLED: "true"
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi