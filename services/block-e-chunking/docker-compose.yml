version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - block-e-network

  postgres:
    image: postgres:16-alpine
    container_name: block_e_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: block_e
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    dns_search: []
    dns:
      - 127.0.0.11
    networks:
      - block-e-network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.embedding_worker worker --loglevel=info --concurrency=1
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/block_e
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    dns_search: []
    dns:
      - 127.0.0.11
    networks:
      - block-e-network
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests

networks:
  block-e-network:
    driver: bridge

volumes:
  postgres_data:
