version: "3.8"

services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: block-f-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - block_f_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: block-f-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  lexical-search:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: block-f-lexical-search
    ports:
      - "8086:8086"
    environment:
      SEARCH_BACKEND: opensearch
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      REDIS_URL: redis://redis:6379/4
      ENVIRONMENT: development
      REFRESH_INTERVAL: 1s
    depends_on:
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./fixtures:/app/fixtures

volumes:
  block_f_opensearch_data:
