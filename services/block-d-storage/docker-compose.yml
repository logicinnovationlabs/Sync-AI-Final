# Block D — Storage Substrate (verify / local dependencies)
#
# Source of truth for how Block D verify containers are provisioned (R8).
# Ports/names match the containers used in SIGNOFF Phase 2 evidence.
#
# Usage:
#   docker compose -f docker-compose.yml up -d
#   docker compose -f docker-compose.yml config --services

services:
  postgres:
    image: postgres:16
    container_name: block-d-verify-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: verify
      POSTGRES_DB: block_d_verify
    ports:
      - "5435:5432"
    volumes:
      - block_d_verify_pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: block-d-verify-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - block_d_verify_minio_data:/data

volumes:
  block_d_verify_pg_data:
  block_d_verify_minio_data: