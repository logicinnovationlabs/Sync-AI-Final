version: "3.8"

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: block-h-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/blockh-dev-password
      NEO4J_PLUGINS: '[]'
    volumes:
      - block_h_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  graph:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: block-h-graph
    ports:
      - "8088:8088"
    environment:
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: blockh-dev-password
      ENVIRONMENT: development
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./fixtures:/app/fixtures

volumes:
  block_h_neo4j_data:
