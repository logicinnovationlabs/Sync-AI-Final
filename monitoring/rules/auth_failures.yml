groups:
  - name: auth
    rules:
      - alert: HighAuthFailureRate
        expr: |
          (
            sum(rate(http_server_duration_milliseconds_count{http_status_code=~"401|403"}[1m]))
            /
            clamp_min(sum(rate(http_server_duration_milliseconds_count[1m])), 1e-6)
          ) > 0.10
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Auth failure rate > 10%"
          description: "More than 10% of HTTP responses are 401/403 for over 30 seconds."

  - name: latency
    rules:
      - alert: HighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_server_duration_milliseconds_bucket[5m])) by (le, http_route)
          ) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency > 500ms"
          description: "Route {{ $labels.http_route }} has P95 latency above 500ms for 5 minutes."

  - name: availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
          description: "Service {{ $labels.job }} at {{ $labels.instance }} has been down for over 1 minute."
