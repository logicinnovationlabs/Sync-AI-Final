apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: true

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: Prometheus
        filterByTraceID: true
        filterBySpanID: true
      serviceMap:
        datasourceUid: Prometheus
      nodeGraph:
        enabled: true
