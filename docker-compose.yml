name: snyq_phase_2

services:
  postgres:
    image: postgres:16-alpine
    container_name: snyq_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: control_plane
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [snyq_network]

  redis:
    image: redis:7-alpine
    container_name: snyq_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [snyq_network]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: snyq_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
    networks: [snyq_network]

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: snyq_opensearch
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    networks: [snyq_network]

  neo4j:
    image: neo4j:5.15.0
    container_name: snyq_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
      # Prometheus metrics (`server.metrics.prometheus.*`) are Enterprise-only.
      # Community 5.15 treats them as unrecognized and refuses to start.
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 180s
    networks: [snyq_network]

  minio:
    image: minio/minio:latest
    container_name: snyq_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks: [snyq_network]

  vault:
    image: hashicorp/vault:1.15.6
    container_name: snyq_vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev
    networks: [snyq_network]

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.18
    container_name: snyq_redpanda
    ports:
      - "9092:9092"
      - "9644:9644"
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 256M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    networks: [snyq_network]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: snyq_otel_collector
    restart: unless-stopped
    ports:
      - "4318:4318"
      - "4317:4317"
      - "8889:8889"
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otel-config.yaml:ro
    networks: [snyq_network]

  prometheus:
    image: prom/prometheus:latest
    container_name: snyq_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks: [snyq_network]

  tempo:
    image: grafana/tempo:latest
    container_name: snyq_tempo
    user: "0"
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo.yml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks: [snyq_network]

  grafana:
    image: grafana/grafana:latest
    container_name: snyq_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Anonymous auth is NOT set here - see docker-compose.override.yml
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3002:3000"
    networks: [snyq_network]

  alertmanager:
    image: prom/alertmanager:latest
    container_name: snyq_alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    networks: [snyq_network]

  # One-shots. Started by `docker compose up -d` but they must NOT block app.
  # App already runs alembic itself. Seed is best-effort after Postgres is up.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snyq_migrate
    env_file:
      - .env.docker
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m alembic upgrade heads
    networks: [snyq_network]

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snyq_seed
    env_file:
      - .env.docker
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    command: python scripts/seed_tenants.py
    networks: [snyq_network]

  seed_test_data:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snyq_seed_test
    env_file:
      - .env.docker
    depends_on:
      seed:
        condition: service_completed_successfully
      opensearch:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    command: python scripts/seed_test_data.py
    profiles:
      - test
    networks: [snyq_network]

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snyq_app
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      GOOGLE_PUBSUB_PROJECT_ID: sync-ai-505006
      GOOGLE_PUBSUB_TOPIC: gmail-push-notifications
      GOOGLE_PUBSUB_SUBSCRIPTION: gmail-push-notifications-sub
      WEBHOOK_BASE_URL: https://sycq-ai-final-2.onrender.com
      GOOGLE_APPLICATION_CREDENTIALS: /app/keys/sync-ai-505006-service-account.json
      VAULT_URL: http://vault:8200
      VAULT_PROVIDER: hashicorp
      VAULT_TOKEN: root
      LLM_PROVIDER: gemini
      EMBEDDING_PROVIDER: gemini
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      opensearch:
        condition: service_started
      neo4j:
        condition: service_started
      vault:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    command: >
      sh -c "python -m alembic upgrade heads && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks: [snyq_network]

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snyq_celery_worker
    env_file:
      - .env.docker
    environment:
      GOOGLE_PUBSUB_PROJECT_ID: sync-ai-505006
      GOOGLE_PUBSUB_TOPIC: gmail-push-notifications
      GOOGLE_PUBSUB_SUBSCRIPTION: gmail-push-notifications-sub
      WEBHOOK_BASE_URL: https://sycq-ai-final-2.onrender.com
      GOOGLE_APPLICATION_CREDENTIALS: /app/keys/sync-ai-505006-service-account.json
      VAULT_URL: http://vault:8200
      VAULT_PROVIDER: hashicorp
      VAULT_TOKEN: root
      LLM_PROVIDER: gemini
      EMBEDDING_PROVIDER: gemini
    volumes:
      - ./backend/app:/app/app
      - ./backend/keys:/app/keys
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      opensearch:
        condition: service_started
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q celery,google
    networks: [snyq_network]

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snyq_celery_beat
    env_file:
      - .env.docker
    volumes:
      - ./backend/app:/app/app
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info
    networks: [snyq_network]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  minio_data:
  prometheus_data:
  tempo_data:

networks:
  snyq_network:
    driver: bridge
