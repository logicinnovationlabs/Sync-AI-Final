name: snyq_phase_2

services:
  postgres:
    image: postgres:16-alpine
    container_name: snyq_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: control_plane
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: snyq_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: snyq_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: snyq_opensearch
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  neo4j:
    image: neo4j:5.15.0
    container_name: snyq_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  minio:
    image: minio/minio:latest
    container_name: snyq_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  vault:
    image: hashicorp/vault:1.15.6
    container_name: snyq_vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.18
    container_name: snyq_redpanda
    ports:
      - "9092:9092"
      - "9644:9644"
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: snyq_otel_collector
    ports:
      - "4318:4318"
      - "4317:4317"
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otel-config.yaml:ro

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snyq_migrate
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "sleep 5 && python -m alembic upgrade head || (sleep 10 && python -m alembic upgrade head)"

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snyq_seed
    env_file:
      - .env.docker
    depends_on:
      migrate:
        condition: service_completed_successfully
      vault:
        condition: service_started
    command: python scripts/seed_tenants.py

  seed_test_data:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snyq_seed_test
    env_file:
      - .env.docker
    depends_on:
      seed:
        condition: service_completed_successfully
      opensearch:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    command: python scripts/seed_test_data.py
    profiles:
      - test

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snyq_app
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      opensearch:
        condition: service_started
      neo4j:
        condition: service_healthy
      vault:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snyq_celery_worker
    env_file:
      - .env.docker
    depends_on:
      app:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snyq_celery_beat
    env_file:
      - .env.docker
    depends_on:
      app:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  minio_data:
