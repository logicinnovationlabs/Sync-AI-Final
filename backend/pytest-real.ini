# pytest.ini - Configuration for real backend testing
[pytest]
markers =
    real_backends: marks tests to run against real backends (deselect with '-m "not real_backends"')
    block_d: Block D Storage tests
    block_e: Block E Chunking tests
    block_f: Block F Lexical Search tests
    block_g: Block G Vector Search tests
    block_h: Block H Knowledge Graph tests
    block_i: Block I Activity Signals tests
    block_j: Block J Query Federator tests

# Environment variables for real backend testing
env =
    # Use real backends
    STORAGE_BACKEND=minio
    DATABASE_BACKEND=postgres
    VAULT_BACKEND=vault
    LEXICAL_BACKEND=opensearch
    VECTOR_BACKEND=qdrant
    GRAPH_BACKEND=neo4j
    SIGNALS_BACKEND=postgres
    
    # Connection strings (Docker service names)
    CONTROL_PLANE_DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/control_plane
    OBJECT_STORE_CONNECTION_STRING=endpoint=http://localhost:9000;accessKey=minioadmin;secretKey=minioadmin;useSSL=false;bucket=glean-data
    VAULT_URL=http://localhost:8200
    OPENSEARCH_URL=http://localhost:9200
    QDRANT_URL=http://localhost:6333
    NEO4J_URI=bolt://localhost:7687
    NEO4J_USER=neo4j
    NEO4J_PASSWORD=password
    REDIS_URL=redis://localhost:6379
