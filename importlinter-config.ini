[importlinter]
root_packages =
    app

# Sources are sibling modules, not the parent package. import-linter rejects
# source/forbidden pairs that share descendants (parent package vs
# app.services.mcp_gateway.acl). Listing the real gateway modules still
# forbids them from importing a homegrown acl/jwt_auth/auth module.

[importlinter:contract:mcp-gateway-no-own-acl]
name = MCP gateway must not define its own ACL or auth implementation
type = forbidden
source_modules =
    app.services.mcp_gateway.router
    app.services.mcp_gateway.dispatch
    app.services.mcp_gateway.identity
    app.services.mcp_gateway.allowlist
    app.services.mcp_gateway.audit
    app.services.mcp_gateway.revocation
forbidden_modules =
    app.services.mcp_gateway.acl
    app.services.mcp_gateway.jwt_auth
    app.services.mcp_gateway.auth

[importlinter:contract:mcp-gateway-single-entry]
name = MCP gateway reaches retrieval only through federator and reader
type = layers
layers =
    app.services.mcp_gateway
    app.services.query_federator | app.services.document_reader
