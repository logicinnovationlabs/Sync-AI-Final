openapi: '3.0.0'
info:
  title: signals contract
  version: '1.0.0'
  description: Block I Activity Ingestion and Signal Service contract
paths:
  /activity/ingest:
    post:
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  ingested_count: { type: integer }
                  already_processed_count: { type: integer }
                  failed_events: { type: array, items: { type: object } }
  /signals/user/{user_id}:
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string }
                  tenant_id: { type: string }
                  signals: { type: object }
                  updated_at: { type: string }
                  freshness_s: { type: number, nullable: true }
  /signals/document/{document_id}:
    get:
      responses:
        '200':
          description: Privacy-gated document popularity
          content:
            application/json:
              schema:
                type: object
                properties:
                  document_id: { type: string }
                  tenant_id: { type: string }
                  privacy_protected: { type: boolean }
                  popularity_score: { type: number, nullable: true }
                  total_views: { type: integer, nullable: true }
                  distinct_viewers: { type: integer, nullable: true }
                  last_viewed: { type: string, nullable: true }