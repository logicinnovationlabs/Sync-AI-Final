services:
  test_runner:
    build:
      context: .
      dockerfile: Dockerfile.integration
    container_name: snyq_test_runner
    depends_on:
      app:
        condition: service_healthy
    environment:
      TEST_PHASE: integration
      USE_REAL_SERVICES: "1"
      USE_INPROCESS_MOCKS: "false"
      REAL_BASE_PORT: "8000"
      TEST_SERVICE_HOST: app
      FIXTURES_PATH: /app/fixtures
      CONTRACTS_PATH: /app/contracts
      JWT_TEST_SECRET: test-suite-hs256-secret-32b-min!!
