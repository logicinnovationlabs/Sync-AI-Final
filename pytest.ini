[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
markers =
    provisional: provisional-phase tests (mocks/fixtures)
    integration: integration-phase tests (real services)
    block_z: Block Z fixtures/contracts
    block_a: Block A auth
    block_b: Block B connectors
    block_c: Block C normalization
    block_d: Block D storage
    block_e: Block E chunking
    block_f: Block F lexical
    block_g: Block G vector
    block_h: Block H graph
    block_i: Block I signals
    block_j: Block J federator
    block_k: Block K reader
    block_l: Block L assistant
    block_m: Block M MCP
    block_n: Block N admin
    block_o: Block O observability

# Two-phase signoff switches:
#   Phase 1 (default): TEST_PHASE=provisional  USE_INPROCESS_MOCKS=true
#   Phase 2:           USE_REAL_SERVICES=1   (or TEST_PHASE=integration)
#                      SEARCH_BACKEND=opensearch | VECTOR_DB_TYPE=qdrant | GRAPH_BACKEND=neo4j
